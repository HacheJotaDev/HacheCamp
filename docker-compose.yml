# HJ Campaigns — Docker Compose de producción
# Proyecto independiente: no comparte redes, volúmenes ni puertos con otros proyectos.
#
# Puerto público configurable por PORT_FRONTEND (por defecto 127.0.0.1:8085).
# PostgreSQL y Redis NO exponen puertos: solo red interna hj_campaigns_internal.
#
# Credenciales de AWS (SES/SQS): los servicios api, worker y scheduler reciben
# los archivos ~/.aws del VPS como secretos Docker (solo lectura, ver
# scripts/deploy.sh → preparar_secretos_aws). Nunca van en el repositorio.

name: hj-campaigns

x-backend: &backend
  build: ./backend
  env_file: .env
  # Red interna compartida: imprescindible para llegar a postgres y redis.
  # (Todos los servicios backend heredan esto; 'migrate' incluido.)
  networks: [hj_internal]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

# Credenciales AWS montadas como secretos de solo lectura (api, worker y scheduler)
x-aws: &aws
  environment:
    # Boto3 lee los archivos de credenciales apuntados por estas variables
    AWS_SHARED_CREDENTIALS_FILE: /run/secrets/aws_credentials
    AWS_CONFIG_FILE: /run/secrets/aws_config
    AWS_PROFILE: ${AWS_PROFILE:-default}
    AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-2}
  secrets:
    - aws_credentials
    - aws_config

secrets:
  # Los archivos los prepara scripts/deploy.sh (copiados de /root/.aws con
  # propietario UID 10001 y modo 400). No contienen nada si no hay credenciales.
  aws_credentials:
    file: ./secrets/aws/credentials
  aws_config:
    file: ./secrets/aws/config

services:
  # ------------------------------------------------------------------ base de datos
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hj_campaigns}
      POSTGRES_USER: ${POSTGRES_USER:-hj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hj} -d ${POSTGRES_DB:-hj_campaigns}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Sin ports: accesible solo desde la red interna
    networks: [hj_internal]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [hj_internal]
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
    deploy:
      resources:
        limits:
          memory: 384m

  # ------------------------------------------------------------------ migraciones (one-shot)
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    # La red hj_internal ya viene del ancla x-backend (necesaria para PostgreSQL)
    healthcheck:
      disable: true

  # ------------------------------------------------------------------ API
  api:
    <<: [*backend, *aws]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      # Solo local por defecto: publicar vía proxy inverso con HTTPS cuando proceda
      - "${BIND_IP:-127.0.0.1}:${PORT_API:-8086}:8000"
    deploy:
      resources:
        limits:
          memory: 768m

  # ------------------------------------------------------------------ worker de envío
  worker:
    <<: [*backend, *aws]
    command: ["python", "-m", "app.workers.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512m

  # ------------------------------------------------------------------ scheduler
  scheduler:
    <<: [*backend, *aws]
    command: ["python", "-m", "app.workers.scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 256m

  # ------------------------------------------------------------------ frontend
  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      # Dirección pública configurable (por defecto solo localhost:8085)
      - "${BIND_IP:-127.0.0.1}:${PORT_FRONTEND:-8085}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [hj_internal]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  pgdata:
    name: hj_campaigns_pgdata
  redisdata:
    name: hj_campaigns_redisdata

networks:
  hj_internal:
    name: hj_campaigns_internal
    driver: bridge
