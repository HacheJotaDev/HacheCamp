# HJ Campaigns — Docker Compose de producción
# Proyecto independiente: no comparte redes, volúmenes ni puertos con otros proyectos.
#
# Separación de acceso (igual que en producción):
#   API       -> ${BIND_IP_API:-127.0.0.1}:${PORT_API:-8086}        (privada)
#   Frontend  -> ${BIND_IP_FRONTEND:-127.0.0.1}:${PORT_FRONTEND:-8085} (público si
#                el .env define BIND_IP_FRONTEND=0.0.0.0)
# PostgreSQL y Redis NO exponen puertos: solo red interna hj_campaigns_internal.
#
# Healthchecks: api usa HTTP (uvicorn); worker, events-worker, import-worker y
# scheduler son procesos de segundo plano SIN servidor HTTP — usan heartbeat en
# Redis (actividad real, ver app/workers/heartbeat.py), no una comprobación de proceso.
#
# Credenciales de AWS (SES/SQS): los servicios api, worker, events-worker y
# scheduler reciben los archivos ~/.aws del VPS como secretos Docker (solo
# lectura, ver scripts/deploy.sh → preparar_secretos_aws). Nunca van en el repositorio.

name: hj-campaigns

x-backend: &backend
  build: ./backend
  env_file: .env
  # Red interna compartida: imprescindible para llegar a postgres y redis.
  # (Todos los servicios backend heredan esto; 'migrate' incluido.)
  networks: [hj_internal]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

# Credenciales AWS montadas como secretos de solo lectura (api, worker y scheduler)
x-aws: &aws
  environment:
    # Boto3 lee los archivos de credenciales apuntados por estas variables
    AWS_SHARED_CREDENTIALS_FILE: /run/secrets/aws_credentials
    AWS_CONFIG_FILE: /run/secrets/aws_config
    AWS_PROFILE: ${AWS_PROFILE:-default}
    AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-2}
  secrets:
    - aws_credentials
    - aws_config

secrets:
  # Los archivos los prepara scripts/deploy.sh (copiados de /root/.aws con
  # propietario UID 10001 y modo 400). No contienen nada si no hay credenciales.
  aws_credentials:
    file: ./secrets/aws/credentials
  aws_config:
    file: ./secrets/aws/config

services:
  # ------------------------------------------------------------------ base de datos
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hj_campaigns}
      POSTGRES_USER: ${POSTGRES_USER:-hj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hj} -d ${POSTGRES_DB:-hj_campaigns}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Sin ports: accesible solo desde la red interna
    networks: [hj_internal]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [hj_internal]
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
    deploy:
      resources:
        limits:
          memory: 384m

  # ------------------------------------------------------------------ migraciones (one-shot)
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    # La red hj_internal ya viene del ancla x-backend (necesaria para PostgreSQL)
    healthcheck:
      disable: true

  # ------------------------------------------------------------------ API
  api:
    <<: [*backend, *aws]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Healthcheck explícito (el del Dockerfile también vale, pero se declara
    # aquí para que la dependencia service_healthy del frontend sea evidente).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      # SOLO local por defecto: pública la del frontend, no esta.
      - "${BIND_IP_API:-127.0.0.1}:${PORT_API:-8086}:8000"
    deploy:
      resources:
        limits:
          memory: 768m

  # ------------------------------------------------------------------ worker de envío
  # Escalable con: docker compose up -d --scale worker=14
  # Los workers de envío NO consumen la cola SQS de eventos salvo que
  # HJ_SQS_IN_SEND_WORKER=1 esté definido en su entorno: el consumidor
  # responsable del pipeline SES->SNS->SQS es el servicio events-worker.
  worker:
    <<: [*backend, *aws]
    command: ["python", "-m", "app.workers.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # worker y scheduler NO exponen HTTP: sobreescribir el HEALTHCHECK de la
    # imagen (curl al 8000, que aquí fallaría siempre -> unhealthy) por una
    # comprobación de ACTIVIDAD REAL: latido en Redis de su bucle de trabajo.
    # Umbral 120 s: el peor caso normal del worker (campaña pausada) es ~30 s.
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.heartbeat", "worker", "--max-age", "120"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

  # ------------------------------------------------------------------ events-worker (SQS)
  # ÚNICO consumidor de la cola de eventos SES (entregas, rebotes, quejas):
  #   SES (conjunto de configuración) -> SNS -> SQS -> events-worker
  # Separado del worker de envío para que escalar a N workers no multiplique
  # consumidores SQS ni enmascare caídas en el latido compartido. Si la cola
  # no está configurada el servicio queda inactivo (latido 'inactivo'), sin
  # reinicios en bucle. Idempotencia por event_uid: reinicios y solapes nunca
  # duplican eventos.
  events-worker:
    <<: [*backend, *aws]
    command: ["python", "-m", "app.workers.events_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Healthcheck por latido real en Redis: el bucle de long polling late tras
    # cada lote (hj:hb:sqs_consumer). Peor caso por ciclo ~60 s (poll 20 s +
    # lectura 40 s) -> umbral 300 s seguro.
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.heartbeat", "sqs_consumer", "--max-age", "300"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m

  # ------------------------------------------------------------------ worker de importaciones
  # Proceso SEPARADO del worker de envíos: una importación de 50k contactos
  # tarda minutos y no debe competir con el envío de campañas ni bloquear el
  # API (que solo crea el trabajo y responde 202). Procesa la cola Redis
  # hj:q:import por lotes con commits cortos; al arrancar reencola trabajos
  # pendientes/interrumpidos (reanudación idempotente).
  import-worker:
    <<: *backend
    command: ["python", "-m", "app.workers.import_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Healthcheck por latido real en Redis (como worker/scheduler). El ciclo
    # normal es de 3-8 s; un trabajo no bloquea el latido (se registra en cada
    # iteración del bucle) -> 120 s es seguro.
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.heartbeat", "import_worker", "--max-age", "120"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

  # ------------------------------------------------------------------ scheduler
  scheduler:
    <<: [*backend, *aws]
    command: ["python", "-m", "app.workers.scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Igual que worker: heartbeat real. Umbral 300 s: el ciclo es de 20 s pero
    # el refresco de cuota SES puede bloquear ~1-2 min (conecta+lee+reintentos).
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.heartbeat", "scheduler", "--max-age", "300"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m

  # ------------------------------------------------------------------ frontend
  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      # Dirección pública configurable: en producción BIND_IP_FRONTEND=0.0.0.0
      - "${BIND_IP_FRONTEND:-127.0.0.1}:${PORT_FRONTEND:-8085}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [hj_internal]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  pgdata:
    name: hj_campaigns_pgdata
  redisdata:
    name: hj_campaigns_redisdata

networks:
  hj_internal:
    name: hj_campaigns_internal
    driver: bridge
